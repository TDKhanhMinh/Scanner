name: Windows desktop packaging

on:
  workflow_dispatch:
  push:
    paths:
      - "scanner/**"
      - "scripts/build-sidecar.ps1"
      - "scripts/test-sidecar.ps1"
      - "scripts/build-windows.ps1"
      - "scripts/create-sidecar-fixtures.py"
      - "apps/desktop/src-tauri/**"
      - ".github/workflows/sidecar-packaging.yml"

jobs:
  package-sidecar:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11.9"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install locked sidecar environment
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r scanner/requirements-sidecar.lock

      - name: Create smoke fixtures
        shell: pwsh
        run: |
          $smokeRoot = Join-Path $env:RUNNER_TEMP "attendance-scanner-sidecar-input"
          python scripts/create-sidecar-fixtures.py --output $smokeRoot
          "SMOKE_INPUT=$smokeRoot" >> $env:GITHUB_ENV

      - name: Install desktop dependencies
        shell: pwsh
        run: npm ci

      - name: Build Windows release pipeline
        shell: pwsh
        run: .\scripts\build-windows.ps1 -PythonPath (Get-Command python).Source -SmokeTestInputRoot $env:SMOKE_INPUT

      - name: Upload Windows release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: attendance-scanner-windows-release
          path: |
            apps/desktop/src-tauri/binaries/*.exe
            apps/desktop/src-tauri/target/release/bundle/**
            build/windows/release-manifest.json
          if-no-files-found: error
